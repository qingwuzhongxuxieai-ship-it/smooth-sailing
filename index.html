<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>刘一帆 · 故事集</title>
<meta name="description" content="一本只写给一个人的故事集。">
<meta name="robots" content="noindex, nofollow">
<link rel="stylesheet" href="styles.css?v=20261002f">
</head>
<body>

<canvas id="sea" aria-hidden="true"></canvas>
<div class="vignette" aria-hidden="true"></div>

<div class="readbar" aria-hidden="true"><i id="readbar"></i></div>

<nav class="rail" id="rail" aria-label="章节导航" hidden></nav>

<a class="skip" href="#main">跳到正文</a>

<div class="page">

  <!-- ============ 封面 ============ -->
  <header class="cover">
    <div class="cover-inner">
      <p class="cover-eyebrow">致</p>
      <h1 class="cover-name" id="coverName">刘一帆</h1>
      <span class="cover-mirror" id="coverMirror" aria-hidden="true"></span>
      <p class="cover-book" id="coverBook">故事集</p>
      <p class="cover-line" id="coverLine"></p>
    </div>

    <div class="cover-meta">
      <span class="cover-clock" id="coverClock">--:--:--</span>
      <span class="cover-date" id="coverDate">—</span>
    </div>

    <a class="cover-cue" href="#foreword">
      <span>翻开</span>
      <i aria-hidden="true"></i>
    </a>
  </header>

  <main id="main">

    <!-- ============ 写在前面 ============ -->
    <section class="sec" id="foreword">
      <p class="eyebrow">序</p>
      <h2 class="sec-title" id="forewordTitle"></h2>
      <div class="prose" id="forewordBody"></div>
    </section>

    <!-- ============ 目录 ============ -->
    <section class="sec" id="toc">
      <p class="eyebrow">目录</p>
      <h2 class="sec-title" id="tocTitle"></h2>
      <ol class="toc-list" id="tocList"></ol>
    </section>

    <!-- ============ 故事 ============ -->
    <div id="stories"></div>

    <!-- ============ 照片与影像 ============ -->
    <section class="sec" id="photos" hidden>
      <p class="eyebrow">影集</p>
      <h2 class="sec-title" id="mediaTitle"></h2>
      <p class="sec-note" id="mediaNote"></p>

      <div class="vlog" id="vlogBlock" hidden>
        <div class="vlog-head">
          <h3 class="sub-title" id="vlogTitle"></h3>
          <span class="vlog-note" id="vlogNote"></span>
        </div>
        <video id="vlogEl" controls playsinline preload="metadata"></video>
        <div class="vlog-pick" id="vlogPick" role="group" aria-label="配乐版本"></div>
      </div>

      <div class="albums" id="albums"></div>
    </section>

    <!-- ============ 还没发生的故事 ============ -->
    <section class="sec" id="sec-list">
      <p class="eyebrow">未完</p>
      <h2 class="sec-title" id="listTitle"></h2>
      <div class="progress-wrap">
        <div class="progress"><i id="listBar"></i></div>
        <span class="progress-text" id="listCount">0 / 0</span>
      </div>
      <ul class="todo-list" id="todoList"></ul>
      <p class="hint">点一下前面的圆圈就算完成 · 勾选会记住</p>
    </section>

    <!-- ============ 星愿 ============ -->
    <section class="sec sec-wide" id="sec-wish">
      <p class="eyebrow">留白</p>
      <h2 class="sec-title" id="wishesTitle"></h2>
      <p class="sec-note" id="wishIntro"></p>

      <div class="sky-wrap">
        <canvas id="sky" aria-hidden="true"></canvas>
        <p class="sky-hint" id="skyHint">在夜空里点一下，就是一颗星</p>
        <button type="button" class="sky-add" id="skyAdd">＋ 写一颗星</button>

        <form class="wish-form" id="wishForm" hidden>
          <input type="text" id="wishInput" maxlength="40" placeholder="写一句想说的话…" autocomplete="off">
          <button type="submit">点亮</button>
          <button type="button" class="wish-cancel" id="wishCancel" aria-label="取消">×</button>
        </form>

        <div class="wish-tip" id="wishTip" hidden></div>
      </div>

      <ul class="sr-only" id="wishA11y" aria-live="polite"></ul>
      <p class="hint">点空白处再加一颗 · 点已有的星星可以看它说了什么</p>
    </section>

    <!-- ============ 后记 ============ -->
    <section class="sec" id="sec-letter">
      <p class="eyebrow">后记</p>
      <article class="paper">
        <h2 class="paper-title" id="letterTitle"></h2>
        <div class="paper-body prose" id="letterBody"></div>
        <p class="paper-sign" id="letterSign"></p>
      </article>

      <div class="colophon">
        <span class="colophon-label" id="colophonLabel">写于</span>
        <div class="counter-row" id="counterRow"></div>
        <p class="counter-note" id="counterNote"></p>
      </div>
    </section>

    <footer class="site-foot">
      <span id="footLeft"></span>
      <span id="footRight"></span>
    </footer>

  </main>
</div>

<div class="lightbox" id="lightbox" hidden>
  <button type="button" class="lb-close" id="lbClose" aria-label="关闭">×</button>
  <button type="button" class="lb-nav prev" id="lbPrev" aria-label="上一张">‹</button>
  <button type="button" class="lb-nav next" id="lbNext" aria-label="下一张">›</button>
  <figure class="lb-figure">
    <img id="lbImg" alt="">
    <figcaption id="lbCap"></figcaption>
  </figure>
</div>

<script src="data.js?v=20261002f"></script>
<script src="app.js?v=20261002f"></script>
</body>
</html>
